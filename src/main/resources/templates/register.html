<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Meesho Register</title><style>body{font-family:Arial;background:#f7f7f7}.box{width:360px;margin:60px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 2px 12px #ddd}h1{color:#9f2089}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px}button{width:100%;padding:12px;background:#9f2089;color:white;border:0;border-radius:5px}.error{color:#c00}</style></head>
<body><div class="box"><h1>meesho</h1><h2>Create Account</h2><p class="error" th:text="${message}"></p><form action="/register" method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Create Account</button></form><p>Already registered? <a href="/login">Login</a></p></div></body></html>
