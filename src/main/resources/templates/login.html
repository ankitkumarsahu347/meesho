<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Meesho Login</title><style>body{font-family:Arial;background:#f7f7f7}.box{width:360px;margin:80px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 2px 12px #ddd}h1{color:#9f2089}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px}button{width:100%;padding:12px;background:#9f2089;color:#fff;border:0;border-radius:5px;font-weight:bold}.error{color:#c00}</style></head>
<body><div class="box"><h1>Meesho</h1><h2>Login</h2><p class="error" th:text="${message}"></p><form action="/login" method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><p>New user? <a href="/register">Create account</a></p><a href="/">Back to shopping</a></div></body>
</html>
