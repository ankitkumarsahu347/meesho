<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>My Cart - Meesho</title><style>body{font-family:Arial;background:#f7f7f7;margin:0}header{background:#9f2089;color:white;padding:18px 6%;font-size:25px;font-weight:bold}.cart{max-width:900px;margin:30px auto}.item{background:white;padding:18px;margin:12px 0;border-radius:8px;display:flex;gap:20px;align-items:center}.item img{width:110px;height:110px;object-fit:cover}.price{font-weight:bold;font-size:18px}.back{display:inline-block;margin-top:15px;color:#9f2089}</style></head><body><header>meesho</header><div class="cart"><h1>My Cart</h1><div th:if="${#lists.isEmpty(products)}">Your cart is empty.</div><div class="item" th:each="p : ${products}"><img th:src="${p.imageUrl}"><div><h3 th:text="${p.name}">Product</h3><p th:text="${p.description}">Description</p><div class="price">₹<span th:text="${p.price}">0</span></div></div></div><a class="back" href="/">← Continue Shopping</a></div></body></html>
